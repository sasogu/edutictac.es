<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

  <div class="max-w-3xl mx-auto px-4 py-10 flex flex-col gap-6">

    <!-- Header -->
    <header class="bg-white rounded-2xl shadow-sm p-8 flex flex-col items-center gap-3 text-center">
      <img src="logo.png" alt="EduTicTac" class="max-w-xs w-full h-auto">
      <h1 class="font-display text-3xl font-bold text-blue-600 tracking-tight">Comunitat EduTicTac</h1>

      <form method="post" action="https://edutictac.es/cercador/" class="flex gap-2">
        <input
          type="text" name="q" placeholder="Cercar..."
          aria-label="Cercar"
          class="flex-1 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
        >
        <input type="hidden" name="categories" value="general,social media">
        <input type="hidden" name="lang" value="all">
        <input type="hidden" name="locale" value="ca">
        <input type="hidden" name="time_range" value="month">
        <button
          type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl transition cursor-pointer whitespace-nowrap"
        >Cercar</button>
      </form>
    </section>

      <a href="https://edutictac.es/moodle/"

        Moodle

      <a href="https://edutictac.es/blog/bibliojocs/"
