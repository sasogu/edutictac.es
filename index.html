<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunitat EduTicTac</title>
  <meta name="description" content="EduTicTac - Una comunitat per compartir, un espai per desenvolupar, un lloc per aprendre">
  <link rel="stylesheet" href="conestilo.css">
</head>
<body>

  <header>
    <img src="logo.png" alt="EduTicTac" class="logo">
    <h1>Comunitat EduTicTac</h1>

  <main>

    <section class="search-section">
      <h2>Cercador Lliure SearXNG</h2>
      <form method="post" action="https://edutictac.es/cercador/" class="search-form">
        <input type="text" name="q" placeholder="Cercar..." aria-label="Cercar">
        <input type="hidden" name="categories" value="general,social media">
        <input type="hidden" name="lang" value="all">
        <input type="hidden" name="locale" value="ca">
        <input type="hidden" name="time_range" value="month">
        <button type="submit">Cercar</button>
      </form>
    </section>

    <nav class="services-grid" aria-label="Serveis EduTicTac">
      <a href="https://edutictac.es/moodle/" class="service-card blue">Moodle</a>
      <a href="https://edutictac.es/blog/bibliojocs/" class="service-card green">Bibliojocs</a>
      <a href="https://edutictac.es/blog/" class="service-card green">Blogs</a>
      <a href="https://eduhoot.edutictac.es" class="service-card orange">EduHoot</a>
      <a href="https://edutictac.es/nextcloud/" class="service-card teal">Nextcloud</a>
      <a href="https://edutictac.es/wikimanuals" class="service-card teal">Wikimanuals</a>
      <a href="https://telegram.me/joinchat/AF9KBj1o0IXttv35k7NAug" class="service-card red">Telegram</a>
      <a href="https://edutictac.es/cataleg/" class="service-card blue">Catàleg PDC</a>
      <a href="https://breu.edutictac.es/" class="service-card green">Breu</a>
      <a href="https://edutictac.es/qr/" class="service-card teal">Genera QR</a>
    </nav>

    <section class="donation-section">
      <p>Si t'agrada el que fem pots col·laborar amb una subscripció anual de 10€</p>
      <a href="https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=P-1E824177JA076172BMXHSOYA" class="paypal-link">
        <img src="paypal.png" alt="Subscriu-te via PayPal">
      </a>
      <a href="https://edutictac.aixeta.cat/ca" class="aixeta-link">
        <img src="https://cdn.filestackcontent.com/y7frYBJlSvGhFmx3nV2K" width="120" height="60" alt="Aixeta - finançament cooperatiu">
      </a>
    </section>
